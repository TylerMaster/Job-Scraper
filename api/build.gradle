plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.jobscraper'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Embedded Tomcat + Spring MVC — keeps the app alive and handles future REST endpoints
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data JPA + Hibernate ORM + HikariCP connection pool
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL JDBC driver — runtime only because our code never imports pg classes directly
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway migration engine — Spring Boot auto-configures this on startup
    implementation 'org.flywaydb:flyway-core'

    // Flyway 10+ requires a separate module per database for PostgreSQL support
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // JUnit 5 + Mockito + AssertJ for testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
